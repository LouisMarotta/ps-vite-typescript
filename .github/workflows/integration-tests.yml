name: Run Integration Tests

on:
  workflow_dispatch: {}
  pull_request:

jobs:
  integration-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          tools: composer

      - name: Install dependencies
        run: bun install

      - name: Build module
        run: bun run build

      - name: Setup DDEV
        uses: ddev/github-action-setup-ddev@v1
        with:
          autostart: true

      - name: Wait for the store to be ready
        run: |
          curl --insecure --fail --retry 30 --retry-delay 5 --retry-all-errors \
            https://ps-vite-typescript.ddev.site/ -o /dev/null

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps

      - name: Run Playwright tests
        run: bun run playwright:test
        env:
          CI: true

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: test-results/
          retention-days: 30

      - name: Stop DDEV
        if: ${{ !cancelled() }}
        run: ddev stop

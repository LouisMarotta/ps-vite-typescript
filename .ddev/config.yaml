# DDEV configuration for the prestashopvite module boilerplate.
#
# The store is installed into .ddev/prestashop by the post-start hook so that
# the whole environment can be recreated from scratch with a single command.
# Docs: https://docs.ddev.com/en/stable/users/configuration/config/
name: ps-vite-typescript
type: php
docroot: .ddev/prestashop
php_version: "8.1"
webserver_type: apache-fpm

router_http_port: "80"
router_https_port: "443"

xdebug_enabled: false

database:
  type: mariadb
  version: "10.11"

# The Vite dev server runs inside the web container and is published through
# DDEV's router over HTTPS. Serving it over HTTPS avoids mixed-content errors
# on the storefront, which DDEV always exposes over HTTPS.
# DDEV requires distinct http and https host ports, so the dev server answers on
# http://<host>:5172 and https://<host>:5173.
web_extra_exposed_ports:
  - name: vite
    container_port: 5173
    http_port: 5172
    https_port: 5173

hooks:
  pre-start:
    # Keep hmr.json in sync with the DDEV hostname so the HMR client and the
    # module's asset loader point at this project.
    - exec-host: bash .ddev/scripts/sync-hmr.sh
  post-start:
    # Installs PrestaShop itself, then links and enables this module.
    - exec: bash /var/www/html/.ddev/scripts/prestashop-setup.sh
